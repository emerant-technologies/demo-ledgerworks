# Coolify: deploy with the "Docker Compose" build pack and set the domain on the
# `ledgerworks` service (container port 80). No host ports are published so the
# Coolify proxy (Traefik/Caddy) handles routing and TLS.
services:
  ledgerworks:
    build:
      context: .
      dockerfile: Dockerfile
    image: ledgerworks:latest
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
